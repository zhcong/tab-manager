<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabFlow</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="container">
    <div class="header">
    </div>

    <div class="section">
      <p class="desc" data-i18n="url_filter_desc">设置 URL 关键字过滤，只有符合条件的标签页会被保存</p>

      <div class="field">
        <label for="include" data-i18n="include_keywords">包含关键字（命中则保存）</label>
        <textarea id="include" placeholder="每行一个关键字，例如：&#10;github&#10;gitlab"></textarea>
        <span class="hint" data-i18n="include_hint">留空则忽略此过滤规则</span>
      </div>

      <div class="field">
        <label for="exclude" data-i18n="exclude_keywords">排除关键字（命中则不保存）</label>
        <textarea id="exclude" placeholder="每行一个关键字，例如：&#10;facebook&#10;twitter"></textarea>
        <span class="hint" data-i18n="exclude_hint">排除优先于包含</span>
      </div>

      <div class="field">
        <label class="toggle-label" for="openInWindow">
          <span data-i18n="open_in_window">在独立窗口中打开</span>
          <span class="toggle-switch">
            <input type="checkbox" id="openInWindow">
            <span class="toggle-slider"></span>
          </span>
        </label>
        <span class="hint" data-i18n="open_in_window_desc">开启后，点击扩展图标会在独立窗口显示历史记录</span>
      </div>

      <div class="field">
        <label class="toggle-label" for="keepClosedGroups">
          <span data-i18n="keep_closed_groups">保留已关闭分组</span>
          <span class="toggle-switch">
            <input type="checkbox" id="keepClosedGroups" checked>
            <span class="toggle-slider"></span>
          </span>
        </label>
        <span class="hint" data-i18n="keep_closed_groups_desc">关闭后，已关闭窗口的记录将被删除而非保留</span>
      </div>
    </div>

    <div class="footer">
      <div class="github-link">
        <a href="https://github.com/zhcong/tab-manager" target="_blank">
          <svg class="github-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          https://github.com/zhcong/tab-manager
        </a>
      </div>
      <div class="btn-group">
        <button id="saveBtn" class="btn-primary" data-i18n="save">保存</button>
        <button id="cancelBtn" class="btn-secondary" data-i18n="cancel">取消</button>
      </div>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
